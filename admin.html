<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>V1ME Community — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#08090d;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   LOGIN
========================================================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(
            circle at top,
            #171b29 0%,
            #08090d 45%
        );
}

.login-box{
    width:100%;
    max-width:420px;

    background:#10121a;

    border:1px solid #252a38;

    border-radius:20px;

    padding:35px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.45);
}

.logo{
    text-align:center;

    font-size:34px;
    font-weight:900;

    letter-spacing:3px;

    margin-bottom:8px;
}

.logo span{
    color:#7c5cff;
}

.login-subtitle{
    text-align:center;

    color:#8d93a5;

    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    color:#aeb4c5;

    font-size:14px;

    margin-bottom:8px;
}

input,
textarea,
select{
    width:100%;

    background:#090b11;

    border:1px solid #292e3d;

    border-radius:10px;

    color:#fff;

    padding:12px 14px;

    outline:none;

    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#7c5cff;

    box-shadow:
        0 0 0 3px rgba(
            124,
            92,
            255,
            .12
        );
}

textarea{
    min-height:120px;

    resize:vertical;
}

.primary-button{
    border:0;

    background:#7c5cff;

    color:white;

    padding:12px 18px;

    border-radius:10px;

    font-weight:700;

    transition:.2s;
}

.primary-button:hover{
    background:#6848ed;

    transform:translateY(-1px);
}

.secondary-button{
    border:1px solid #303647;

    background:#171a23;

    color:#fff;

    padding:11px 16px;

    border-radius:10px;

    font-weight:700;
}

.secondary-button:hover{
    background:#202432;
}

.danger-button{
    border:1px solid #71303a;

    background:#32151a;

    color:#ff8793;

    padding:10px 14px;

    border-radius:9px;

    font-weight:700;
}

.danger-button:hover{
    background:#4a1b22;
}

.success-button{
    border:1px solid #285e48;

    background:#112c21;

    color:#65e0a5;

    padding:10px 14px;

    border-radius:9px;

    font-weight:700;
}

.warning-button{
    border:1px solid #665523;

    background:#2d2611;

    color:#f1d66b;

    padding:10px 14px;

    border-radius:9px;

    font-weight:700;
}

.login-error{
    color:#ff7f8d;

    background:#2b1217;

    border:1px solid #642831;

    padding:10px;

    border-radius:9px;

    margin-top:15px;

    display:none;
}


/* =========================================================
   ADMIN
========================================================= */

.admin{
    display:none;

    min-height:100vh;
}

.sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:250px;

    background:#0d0f15;

    border-right:1px solid #222632;

    padding:22px 15px;

    z-index:20;
}

.sidebar-logo{
    font-size:25px;

    font-weight:900;

    letter-spacing:2px;

    padding:0 12px 25px;
}

.sidebar-logo span{
    color:#7c5cff;
}

.sidebar-title{
    font-size:11px;

    color:#666d7e;

    text-transform:uppercase;

    letter-spacing:1.5px;

    padding:0 12px 10px;
}

.nav-button{
    width:100%;

    text-align:left;

    background:transparent;

    border:0;

    color:#9ba2b4;

    padding:12px;

    border-radius:9px;

    margin-bottom:4px;

    font-size:14px;

    font-weight:600;
}

.nav-button:hover{
    background:#171a23;

    color:#fff;
}

.nav-button.active{
    background:#211b3c;

    color:#a996ff;
}

.logout-button{
    position:absolute;

    bottom:20px;

    left:15px;
    right:15px;

    width:calc(100% - 30px);

    background:#211318;

    border:1px solid #48232b;

    color:#ff8b98;

    padding:12px;

    border-radius:10px;

    font-weight:700;
}

.main{
    margin-left:250px;

    padding:30px;

    min-height:100vh;
}

.topbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:30px;
}

.topbar h1{
    font-size:28px;
}

.admin-status{
    color:#65e0a5;

    font-size:13px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.section-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:22px;
}

.section-head h2{
    font-size:22px;
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(300px,1fr)
        );

    gap:16px;
}

.card{
    background:#10121a;

    border:1px solid #252a38;

    border-radius:15px;

    padding:18px;
}

.card h3{
    margin-bottom:10px;
}

.muted{
    color:#8c93a5;
}

.small{
    font-size:13px;
}

.card-row{
    display:flex;

    justify-content:space-between;

    gap:12px;

    margin:7px 0;

    color:#b7bdca;
}

.card-actions{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:16px;
}

.badge{
    display:inline-flex;

    align-items:center;

    padding:5px 9px;

    border-radius:999px;

    font-size:11px;

    font-weight:800;

    text-transform:uppercase;
}

.badge.live{
    background:#36151a;

    color:#ff7b88;
}

.badge.finished{
    background:#123122;

    color:#65e0a5;
}

.badge.soon,
.badge.scheduled{
    background:#20232c;

    color:#aeb5c6;
}

.badge.pending{
    background:#322b12;

    color:#efd66e;
}

.badge.approved{
    background:#123122;

    color:#65e0a5;
}

.badge.rejected{
    background:#36151a;

    color:#ff7b88;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:620px;

    max-height:90vh;

    overflow:auto;

    background:#11141c;

    border:1px solid #2a2f3d;

    border-radius:17px;

    padding:24px;
}

.modal-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;
}

.modal-head h3{
    font-size:21px;
}

.close{
    background:#1b1e27;

    border:0;

    color:#aeb4c3;

    width:34px;

    height:34px;

    border-radius:8px;

    font-size:18px;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;
}


/* =========================================================
   TEAMS
========================================================= */

.player-list{
    display:flex;

    flex-direction:column;

    gap:8px;
}

.player-row{
    display:flex;

    gap:8px;
}

.player-row input{
    flex:1;
}

.remove-player{
    width:40px;

    border:1px solid #4d252c;

    background:#291317;

    color:#ff7786;

    border-radius:8px;
}


/* =========================================================
   MATCH
========================================================= */

.match-card{
    position:relative;
}

.match-teams{
    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    gap:10px;

    align-items:center;

    margin:18px 0;
}

.match-team{
    background:#0a0c11;

    border:1px solid #242937;

    border-radius:10px;

    padding:12px;

    min-height:55px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-weight:700;
}

.match-score{
    font-size:23px;

    font-weight:900;
}

.winner{
    border-color:#65e0a5;

    color:#65e0a5;
}


/* =========================================================
   BRACKET
========================================================= */

.bracket-wrapper{
    overflow-x:auto;

    padding-bottom:20px;
}

.bracket{
    display:flex;

    gap:25px;

    min-width:max-content;

    align-items:stretch;
}

.bracket-round{
    width:230px;

    display:flex;

    flex-direction:column;
}

.bracket-round-title{
    text-align:center;

    color:#a99cff;

    font-weight:800;

    margin-bottom:15px;

    font-size:14px;
}

.bracket-matches{
    flex:1;

    display:flex;

    flex-direction:column;
}

.bracket-match{
    background:#10121a;

    border:1px solid #292e3d;

    border-radius:11px;

    overflow:hidden;

    margin-bottom:20px;
}

.bracket-team{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:5px;

    padding:10px;

    border-bottom:1px solid #222633;

    min-height:40px;
}

.bracket-team:last-child{
    border-bottom:0;
}

.bracket-team-name{
    font-size:12px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.bracket-score{
    font-weight:900;
}

.bracket-meta{
    padding:8px 10px;

    color:#7f8799;

    font-size:10px;

    border-top:1px solid #222633;
}

.bracket-winner{
    border-color:#65e0a5;

    color:#65e0a5;
}

.champion-box{
    background:
        linear-gradient(
            135deg,
            #211b3c,
            #11141c
        );

    border:1px solid #7c5cff;

    border-radius:15px;

    padding:22px;

    text-align:center;

    margin-bottom:25px;
}

.champion-box .trophy{
    font-size:38px;

    margin-bottom:8px;
}

.champion-box h3{
    color:#a996ff;

    margin-bottom:7px;
}

.champion-name{
    font-size:25px;

    font-weight:900;
}


/* =========================================================
   NEWS
========================================================= */

.news-content{
    white-space:pre-wrap;

    color:#b8bfce;

    line-height:1.5;

    margin-top:12px;
}

.news-image{
    width:100%;

    max-height:220px;

    object-fit:cover;

    border-radius:10px;

    margin-bottom:12px;
}


/* =========================================================
   SUPPORT
========================================================= */

.support-question{
    background:#0a0c11;

    border:1px solid #242937;

    border-radius:10px;

    padding:14px;

    margin-top:8px;

    color:#b8bfce;

    line-height:1.6;

    white-space:pre-wrap;
}

.support-answer{
    background:#112c21;

    border:1px solid #285e48;

    border-radius:10px;

    padding:14px;

    margin-top:8px;

    color:#65e0a5;

    line-height:1.6;

    white-space:pre-wrap;
}

.support-meta{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;

    color:#777e90;

    padding:40px 20px;

    border:1px dashed #292e3a;

    border-radius:14px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;

        padding:20px;
    }

}


@media(max-width:650px){

    .sidebar{
        position:static;

        width:100%;

        min-height:auto;
    }

    .logout-button{
        position:static;

        width:100%;

        margin-top:10px;
    }

    .main{
        margin-left:0;
    }

    .topbar{
        flex-direction:column;

        align-items:flex-start;
    }

    .sidebar{
        display:flex;

        flex-wrap:wrap;

        gap:5px;
    }

    .sidebar-logo{
        width:100%;
    }

    .sidebar-title{
        display:none;
    }

    .nav-button{
        width:auto;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div
    class="login-screen"
    id="loginScreen"
>

    <div class="login-box">

        <div class="logo">
            V1ME <span>COMMUNITY</span>
        </div>

        <div class="login-subtitle">
            Панель адміністратора
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                    placeholder="admin@email.com"
                >

            </div>


            <div class="form-group">

                <label>
                    Пароль
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="••••••••"
                >

            </div>


            <button
                class="primary-button"
                style="width:100%;"
                type="submit"
            >
                Увійти
            </button>


            <div
                class="login-error"
                id="loginError"
            ></div>

        </form>

    </div>

</div>



<!-- =========================================================
     ADMIN
========================================================= -->

<div
    class="admin"
    id="adminPanel"
>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            V1ME <span>ADMIN</span>
        </div>


        <div class="sidebar-title">
            Керування
        </div>


        <button
            class="nav-button active"
            data-section="tournaments"
        >
            🏆 Турніри
        </button>


        <button
            class="nav-button"
            data-section="applications"
        >
            📋 Заявки
        </button>


        <button
            class="nav-button"
            data-section="teams"
        >
            👥 Команди
        </button>


        <button
            class="nav-button"
            data-section="matches"
        >
            ⚔️ Матчі
        </button>


        <button
            class="nav-button"
            data-section="bracket"
        >
            🏆 Сітка
        </button>


        <button
            class="nav-button"
            data-section="news"
        >
            📰 Новини
        </button>


        <button
            class="nav-button"
            data-section="support"
        >
            🎧 Підтримка
        </button>


        <button
            class="logout-button"
            id="logoutButton"
        >
            🚪 Вийти
        </button>

    </aside>



    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <h1 id="pageTitle">
                Турніри
            </h1>

            <div class="admin-status">
                ● ADMIN ONLINE
            </div>

        </div>



        <!-- =====================================================
             TOURNAMENTS
        ====================================================== -->

        <section
            class="section active"
            id="section-tournaments"
        >

            <div class="section-head">

                <h2>
                    Турніри
                </h2>


                <button
                    class="primary-button"
                    onclick="openTournamentForm()"
                >
                    + Створити турнір
                </button>

            </div>


            <div
                class="cards"
                id="tournamentsList"
            ></div>

        </section>



        <!-- =====================================================
             APPLICATIONS
        ====================================================== -->

        <section
            class="section"
            id="section-applications"
        >

            <div class="section-head">

                <h2>
                    Заявки
                </h2>

            </div>


            <div
                class="cards"
                id="applicationsList"
            ></div>

        </section>



        <!-- =====================================================
             TEAMS
        ====================================================== -->

        <section
            class="section"
            id="section-teams"
        >

            <div class="section-head">

                <h2>
                    Команди
                </h2>


                <button
                    class="primary-button"
                    onclick="openTeamForm()"
                >
                    + Додати команду
                </button>

            </div>


            <div
                class="cards"
                id="teamsList"
            ></div>

        </section>



        <!-- =====================================================
             MATCHES
        ====================================================== -->

        <section
            class="section"
            id="section-matches"
        >

            <div class="section-head">

                <h2>
                    Матчі
                </h2>


                <button
                    class="primary-button"
                    onclick="openMatchForm()"
                >
                    + Додати матч
                </button>

            </div>


            <div
                class="cards"
                id="matchesList"
            ></div>

        </section>



        <!-- =====================================================
             BRACKET
        ====================================================== -->

        <section
            class="section"
            id="section-bracket"
        >

            <div class="section-head">

                <h2>
                    Сітка турніру
                </h2>


                <select
                    id="bracketTournamentSelect"
                    style="max-width:300px;"
                >

                    <option value="">
                        Оберіть турнір
                    </option>

                </select>

            </div>


            <div
                id="adminChampion"
            ></div>


            <div class="bracket-wrapper">

                <div
                    class="bracket"
                    id="adminBracket"
                ></div>

            </div>

        </section>



        <!-- =====================================================
             NEWS
        ====================================================== -->

        <section
            class="section"
            id="section-news"
        >

            <div class="section-head">

                <h2>
                    Новини
                </h2>


                <button
                    class="primary-button"
                    onclick="openNewsForm()"
                >
                    + Створити пост
                </button>

            </div>


            <div
                class="cards"
                id="newsList"
            ></div>

        </section>



        <!-- =====================================================
             SUPPORT
        ====================================================== -->

        <section
            class="section"
            id="section-support"
        >

            <div class="section-head">

                <div>

                    <h2>
                        Підтримка
                    </h2>


                    <div
                        class="muted small"
                        style="margin-top:6px;"
                    >
                        Питання та звернення користувачів
                    </div>

                </div>

            </div>


            <div
                class="cards"
                id="supportList"
            ></div>

        </section>

    </main>

</div>



<!-- =========================================================
     TOURNAMENT MODAL
========================================================= -->

<div
    class="modal"
    id="tournamentModal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h3 id="tournamentModalTitle">
                Створити турнір
            </h3>


            <button
                class="close"
                onclick="closeModal('tournamentModal')"
            >
                ×
            </button>

        </div>


        <form id="tournamentForm">


            <input
                type="hidden"
                id="tournamentId"
            >


            <div class="form-group">

                <label>
                    Назва
                </label>


                <input
                    id="tournamentName"
                    required
                    placeholder="V1ME CUP #1"
                >

            </div>



            <div class="form-group">

                <label>
                    Призовий фонд
                </label>


                <input
                    id="tournamentPrize"
                    required
                    placeholder="500 ₴"
                >

            </div>



            <div class="form-group">

                <label>
                    Кількість команд
                </label>


                <select id="tournamentTeamsCount">

                    <option value="8">
                        8 команд
                    </option>

                    <option value="16">
                        16 команд
                    </option>

                    <option value="32">
                        32 команд
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>
                    Дата
                </label>


                <input
                    type="date"
                    id="tournamentDate"
                >

            </div>



            <div class="form-group">

                <label>
                    Час
                </label>


                <input
                    type="time"
                    id="tournamentTime"
                >

            </div>



            <div class="form-group">

                <label>
                    Формат
                </label>


                <select id="tournamentFormat">

                    <option value="Single Elimination">
                        Single Elimination
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>
                    Статус
                </label>


                <select id="tournamentStatus">

                    <option value="soon">
                        soon
                    </option>

                    <option value="live">
                        live
                    </option>

                    <option value="finished">
                        finished
                    </option>

                </select>

            </div>



            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="closeModal('tournamentModal')"
                >
                    Скасувати
                </button>


                <button
                    class="primary-button"
                    type="submit"
                >
                    Зберегти
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================================
     TEAM MODAL
========================================================= -->

<div
    class="modal"
    id="teamModal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h3 id="teamModalTitle">
                Створити команду
            </h3>


            <button
                class="close"
                onclick="closeModal('teamModal')"
            >
                ×
            </button>

        </div>


        <form id="teamForm">


            <input
                type="hidden"
                id="teamId"
            >

                const freePlaces =
                    Math.max(
                        0,
                        maxTeams -
                        registeredTeams
                    );


                const progress =
                    Math.min(
                        100,
                        (

                            maxTeams
                        ) * 100
                    );


                const isFull =
                    registeredTeams >=
                    maxTeams;


                return `

                        <div
                            style="
                                display:flex;
                                justify-content:space-between;

                                        border:1px solid #285e48;
                                        color:#65e0a5;
                                        font-size:13px;
                                        font-weight:700;
                                        margin-bottom:10px;
                                    "
                                >
                                    🔒 Турнір заповнений
                                </div>

                            `

                            `

                                <div
                                    style="
                                        padding:9px 11px;
                                        border-radius:9px;
                                        background:#20232c;
                                        color:#aeb5c6;
                                        font-size:13px;
                                        margin-bottom:10px;
                                    "
                                >
                                    🟢 Вільних місць:
                                    ${freePlaces}
                                </div>

                            `

/* =========================================================
   BRACKET GENERATION
========================================================= */

function getRoundsForTeams(teamCount){

    if(
        Number(teamCount) ===
        8
    ){

        return [
            "1/4 фіналу",
            "1/2 фіналу",
            "Фінал"
        ];

    }


    if(
        Number(teamCount) ===
        16
    ){

        return [
            "1/8 фіналу",
            "1/4 фіналу",
            "1/2 фіналу",
            "Фінал"
        ];

    }


    if(
        Number(teamCount) ===
        32
    ){

        return [
            "1/16 фіналу",
            "1/8 фіналу",
            "1/4 фіналу",
            "1/2 фіналу",
            "Фінал"
        ];

    }


    return [];

}


function getNextRound(round){

    const next = {

        "1/16 фіналу":
            "1/8 фіналу",

        "1/8 фіналу":
            "1/4 фіналу",

        "1/4 фіналу":
            "1/2 фіналу",

        "1/2 фіналу":
            "Фінал"

    };


    return (
        next[round] ||
        null
    );

}


function shuffleArray(array){

    const arr =
        [...array];


    for(
        let i =
            arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


async function generateBracket(
    tournamentId
){

    const tournament =
        tournaments.find(
            t =>
                Number(t.id) ===
                Number(tournamentId)
        );


    if(!tournament)
        return;


    const teamCount =
        Number(
            tournament.teams_count ||
            8
        );


    const rounds =
        getRoundsForTeams(
            teamCount
        );


    if(!rounds.length){

        alert(
            "Кількість команд має бути 8, 16 або 32."
        );

        return;
    }


    const {
        data:tournamentTeams,
        error:teamsError
    } =
        await supabaseClient
            .from("teams")
            .select("*")
            .eq(
                "tournament_id",
                tournamentId
            )
            .order(
                "id",
                {
                    ascending:true
                }
            );


    if(teamsError){

        alert(
            "Помилка завантаження команд: " +
            teamsError.message
        );

        return;
    }


    if(
        !tournamentTeams ||
        tournamentTeams.length <
        teamCount
    ){

        alert(
            `Для турніру "${tournament.name}" ` +
            `потрібно ${teamCount} команд.\n\n` +
            `Зараз є: ${
                tournamentTeams?.length ||
                0
            }`
        );

        return;
    }


    const {
        data:existingMatches,
        error:existingError
    } =
        await supabaseClient
            .from("matches")
            .select("id")
            .eq(
                "tournament_id",
                tournamentId
            );


    if(existingError){

        alert(
            existingError.message
        );

        return;
    }


    if(
        existingMatches &&
        existingMatches.length
    ){

        const ok =
            confirm(
                `Для цього турніру вже існує ` +
                `${existingMatches.length} матчів.\n\n` +
                `Пересформування видалить ` +
                `стару сітку та результати.\n\n` +
                `Продовжити?`
            );


        if(!ok)
            return;


        const {
            error:deleteError
        } =
            await supabaseClient
                .from("matches")
                .delete()
                .eq(
                    "tournament_id",
                    tournamentId
                );


        if(deleteError){

            alert(
                "Не вдалося видалити стару сітку: " +
                deleteError.message
            );

            return;
        }

    }


    const shuffled =
        shuffleArray(
            tournamentTeams
        ).slice(
            0,
            teamCount
        );


    const newMatches = [];


    const firstRound =
        rounds[0];


    const firstRoundMatches =
        teamCount / 2;


    for(
        let i = 0;
        i < firstRoundMatches;
        i++
    ){

        const team1 =
            shuffled[
                i * 2
            ];


        const team2 =
            shuffled[
                i * 2 + 1
            ];


        newMatches.push({

            tournament_id:
                tournamentId,

            round:
                firstRound,

            match_number:
                i + 1,

            team1_id:
                team1.id,

            team2_id:
                team2.id,

            team1_score:
                0,

            team2_score:
                0,

            winner_id:
                null,

            status:
                "scheduled",

            match_date:
                tournament.tournament_date ||
                null,

            match_time:
                tournament.tournament_time ||
                null,

            map:
                null

        });

    }


    let matchesInRound =
        firstRoundMatches /
        2;


    for(
        let r = 1;
        r < rounds.length;
        r++
    ){

        for(
            let i = 0;
            i < matchesInRound;
            i++
        ){

            newMatches.push({

                tournament_id:
                    tournamentId,

                round:
                    rounds[r],

                match_number:
                    i + 1,

                team1_id:
                    null,

                team2_id:
                    null,

                team1_score:
                    0,

                team2_score:
                    0,

                winner_id:
                    null,

                status:
                    "scheduled",

                match_date:
                    tournament.tournament_date ||
                    null,

                match_time:
                    tournament.tournament_time ||
                    null,

                map:
                    null

            });

        }


        matchesInRound =
            matchesInRound /
            2;

    }


    const {
        error:insertError
    } =
        await supabaseClient
            .from("matches")
            .insert(
                newMatches
            );


    if(insertError){

        alert(
            "Не вдалося створити сітку: " +
            insertError.message
        );

        return;
    }


    alert(
        `Сітку "${tournament.name}" сформовано!\n\n` +
        `Команд: ${teamCount}\n` +
        `Раундів: ${rounds.length}\n` +
        `Матчів: ${newMatches.length}`
    );


    await loadMatches();

    await loadBracket();

}

async function approveApplication(id){

    const app =
        applications.find(
            a =>
                Number(a.id) ===
                Number(id)
        );


    if(!app){

        alert(
            "Заявку не знайдено."
        );

        return;
    }


    if(
        app.status ===
        "approved"
    ){

        alert(
            "Ця заявка вже схвалена."
        );

        return;
    }


    if(
        app.status ===
        "rejected"
    ){

        alert(
            "Ця заявка вже відхилена."
        );

        return;
    }


    const tournament =
        tournaments.find(
            t =>
                String(t.name)
                    .trim() ===
                String(
                    app.tournament ||
                    ""
                ).trim()
        );


    if(!tournament){

        alert(
            "Не вдалося знайти турнір, " +
            "який вказаний у заявці:\n\n" +
            (
                app.tournament ||
                "Не вказано"
            )
        );

        return;
    }


    const maxTeams =
        Number(
            tournament.teams_count ||
            8
        );


    const {
        data:currentTeams,
        error:teamsCountError
    } =
        await supabaseClient
            .from("teams")
            .select(
                "id,name"
            )
            .eq(
                "tournament_id",
                tournament.id
            );


    if(teamsCountError){

        alert(
            "Не вдалося перевірити кількість команд:\n\n" +
            teamsCountError.message
        );

        return;
    }


    const currentCount =
        currentTeams?.length ||
        0;


    const {
        data:existingTeam,
        error:existingTeamError
    } =
        await supabaseClient
            .from("teams")
            .select(
                "id,name"
            )
            .eq(
                "name",
                app.team_name
            )
            .eq(
                "tournament_id",
                tournament.id
            )
            .maybeSingle();


    if(existingTeamError){

        alert(
            "Помилка перевірки команди:\n\n" +
            existingTeamError.message
        );

        return;
    }


    if(existingTeam){

        const {
            error:updateError
        } =
            await supabaseClient
                .from(
                    "tournament_applications"
                )
                .update({
                    status:
                        "approved"
                })
                .eq(
                    "id",
                    id
                );


        if(updateError){

            alert(
                "Помилка: " +
                updateError.message
            );

            return;
        }


        await loadApplications();

        await loadTeams();


        alert(
            `Заявку схвалено.\n\n` +
            `Команда "${app.team_name}" ` +
            `вже була зареєстрована в цьому турнірі.`
        );

        return;
    }


    if(
        currentCount >=
        maxTeams
    ){

        alert(
            `❌ Турнір "${tournament.name}" вже заповнений.\n\n` +
            `Місць: ${maxTeams}\n` +
            `Зайнято: ${currentCount}\n\n` +
            `Нову команду додати неможливо.`
        );

        return;
    }


    const {
        error:teamError
    } =
        await supabaseClient
            .from("teams")
            .insert({

                name:
                    app.team_name,

                tournament_id:
                    tournament.id,

                players:
                    app.players ||
                    "",

                substitutes:
                    ""

            });


    if(teamError){

        alert(
            "Не вдалося створити команду:\n\n" +
            teamError.message
        );

        return;
    }


    const {
        error:approveError
    } =
        await supabaseClient
            .from(
                "tournament_applications"
            )
            .update({

                status:
                    "approved"

            })
            .eq(
                "id",
                id
            );


    if(approveError){

        alert(
            "Команду створено, але не вдалося змінити статус заявки:\n\n" +
            approveError.message
        );


        await loadTeams();

        await loadApplications();

        return;
    }


    const newCount =
        currentCount + 1;


    await loadApplications();

    await loadTeams();

    await loadTournaments();


    if(
        newCount >=
        maxTeams
    ){

        alert(
            `✅ Команду "${app.team_name}" успішно зареєстровано!\n\n` +
            `🏆 Турнір: ${tournament.name}\n` +
            `👥 Команди: ${newCount}/${maxTeams}\n\n` +
            `🔒 Ліміт команд досягнуто.\n\n` +
            `⚙️ Тепер можна формувати сітку.`
        );

    }else{

        alert(
            `✅ Команду "${app.team_name}" успішно зареєстровано!\n\n` +
            `🏆 Турнір: ${tournament.name}\n` +
            `👥 Команди: ${newCount}/${maxTeams}\n\n` +
            `🟢 Вільних місць: ${
                maxTeams -
                newCount
            }`
        );

    }

}

document

            e.preventDefault();


            const id =
                document
                    .getElementById(
                        "matchId"
                    )
                    .value;


            const tournamentId =
                document
                    .getElementById(
                        "matchTournament"
                    )
                    .value

                    ?

                    Number(
                        document
                            .getElementById(
                                "matchTournament"
                            )
                            .value
                    )

                    :

                    null;


            const team1Id =
                document
                    .getElementById(
                        "matchTeam1"
                    )
                    .value

                    ?

                    Number(
                        document
                            .getElementById(
                                "matchTeam1"
                            )
                            .value
                    )

                    :

                    null;


            const team2Id =
                document
                    .getElementById(
                        "matchTeam2"
                    )
                    .value

                    ?

                    Number(
                        document
                            .getElementById(
                                "matchTeam2"
                            )
                            .value
                    )

                    :

                    null;


            const score1 =
                Number(
                    document
                        .getElementById(
                            "matchScore1"
                        )
                        .value ||
                    0
                );


            const score2 =
                Number(
                    document
                        .getElementById(
                            "matchScore2"
                        )
                        .value ||
                    0
                );


            const status =
                document
                    .getElementById(
                        "matchStatus"
                    )
                    .value;


            const round =
                document
                    .getElementById(
                        "matchRound"
                    )
                    .value;


            const matchNumber =
                Number(
                    document
                        .getElementById(
                            "matchNumber"
                        )
                        .value ||
                    1
                );


            let oldMatch =
                null;


            if(id){

                const {
                    data
                } =
                    await supabaseClient
                        .from("matches")
                        .select("*")
                        .eq(
                            "id",
                            id
                        )
                        .single();


                oldMatch =
                    data;

            }


            if(
                status ===
                "finished"
            ){

                if(
                    !team1Id ||
                    !team2Id
                ){

                    alert(
                        "Щоб завершити матч, повинні бути дві команди."
                    );

                    return;
                }


                if(
                    score1 ===
                    score2
                ){

                    alert(
                        "Матч не може бути завершений з однаковим рахунком."
                    );

                    return;
                }

            }


            let winnerId =
                null;


            if(
                status ===
                "finished"
            ){

                winnerId =
                    score1 >
                    score2

                    ?

                    team1Id

                    :

                    team2Id;

            }


            const payload = {

                tournament_id:
                    tournamentId,

                round:
                    round,

                match_number:
                    matchNumber,

                team1_id:
                    team1Id,

                team2_id:
                    team2Id,

                team1_score:
                    score1,

                team2_score:
                    score2,

                winner_id:
                    winnerId,

                status:
                    status,

                match_date:
                    document
                        .getElementById(
                            "matchDate"
                        )
                        .value ||
                    null,

                match_time:
                    document
                        .getElementById(
                            "matchTime"
                        )
                        .value ||
                    null,

                map:
                    document
                        .getElementById(
                            "matchMap"
                        )
                        .value ||
                    null

            };


            let savedMatch =
                null;


            if(id){

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("matches")
                        .update(
                            payload
                        )
                        .eq(
                            "id",
                            id
                        )
                        .select()
                        .single();


                if(error){

                    alert(
                        "Помилка: " +
                        error.message
                    );

                    return;
                }


                savedMatch =
                    data;

            }else{

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("matches")
                        .insert(
                            payload
                        )
                        .select()
                        .single();


                if(error){

                    alert(
                        "Помилка: " +
                        error.message
                    );

                    return;
                }


                savedMatch =
                    data;

            }


            if(oldMatch){

                const oldWinner =
                    oldMatch.winner_id;


                const newWinner =
                    winnerId;


                if(
                    oldWinner &&
                    (
                        !newWinner ||
                        Number(oldWinner) !==
                        Number(newWinner) ||
                        oldMatch.round !==
                        round ||
                        Number(
                            oldMatch.match_number
                        ) !==
                        matchNumber
                    )
                ){

                    await removeWinnerFromNextMatch(
                        oldMatch
                    );

                }

            }


            if(
                status ===
                "finished" &&
                winnerId
            ){

                await advanceWinner(
                    savedMatch
                );

            }


            if(
                round ===
                "Фінал" &&
                status ===
                "finished" &&
                winnerId
            ){

                await finishTournament(
                    tournamentId,
                    winnerId
                );

            }


            closeModal(
                "matchModal"
            );


            await loadMatches();

            await loadTournaments();

            await loadBracket();

        }
    );



/* =========================================================
   ADVANCE WINNER
========================================================= */

async function advanceWinner(
    match
){

    const nextRound =
        getNextRound(
            match.round
        );


    if(!nextRound)
        return;


    const nextMatchNumber =
        Math.ceil(
            Number(
                match.match_number
            ) /
            2
        );


    const {
        data:nextMatch,
        error
    } =
        await supabaseClient
            .from("matches")
            .select("*")
            .eq(
                "tournament_id",
                match.tournament_id
            )
            .eq(
                "round",
                nextRound
            )
            .eq(
                "match_number",
                nextMatchNumber
            )
            .maybeSingle();


    if(error){

        console.error(error);

        return;
    }


    if(!nextMatch){

        console.error(
            "Наступний матч не знайдено",
            nextRound,
            nextMatchNumber
        );

        return;
    }


    const updates = {};


    if(
        Number(
            match.match_number
        ) %
        2 ===
        1
    ){

        updates.team1_id =
            match.winner_id;

    }else{

        updates.team2_id =
            match.winner_id;

    }


    await supabaseClient
        .from("matches")
        .update(
            updates
        )
        .eq(
            "id",
            nextMatch.id
        );

}



/* =========================================================
   REMOVE OLD WINNER
========================================================= */

async function removeWinnerFromNextMatch(
    oldMatch
){

    const nextRound =
        getNextRound(
            oldMatch.round
        );


    if(!nextRound)
        return;


    const nextMatchNumber =
        Math.ceil(
            Number(
                oldMatch.match_number
            ) /
            2
        );


    const {
        data:nextMatch
    } =
        await supabaseClient
            .from("matches")
            .select("*")
            .eq(
                "tournament_id",
                oldMatch.tournament_id
            )
            .eq(
                "round",
                nextRound
            )
            .eq(
                "match_number",
                nextMatchNumber
            )
            .maybeSingle();


    if(!nextMatch)
        return;


    const updates = {};


    if(
        Number(
            oldMatch.match_number
        ) %
        2 ===
        1
    ){

        if(
            Number(
                nextMatch.team1_id
            ) ===
            Number(
                oldMatch.winner_id
            )
        ){

            updates.team1_id =
                null;

        }

    }else{

        if(
            Number(
                nextMatch.team2_id
            ) ===
            Number(
                oldMatch.winner_id
            )
        ){

            updates.team2_id =
                null;

        }

    }


    if(
        Object.keys(
            updates
        ).length
    ){

        await supabaseClient
            .from("matches")
            .update(
                updates
            )
            .eq(
                "id",
                nextMatch.id
            );

    }

}

async function deleteMatch(id){

    const match =
        matches.find(
            m =>
                Number(m.id) ===
                Number(id)
        );


    if(!match)
        return;


    const ok =
        confirm(
            "Видалити цей матч?\n\n" +

            "його переможець також може " +
            "бути прибраний з наступного раунду."
        );


    if(!ok)
        return;


    if(match.winner_id){

        await removeWinnerFromNextMatch(
            match
        );

    }


    const {
        error
    } =
        await supabaseClient
            .from("matches")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Помилка: " +
            error.message
        );

        return;
    }


    await loadMatches();

    await loadBracket();

}

async function loadBracket(){

    const select =
        document.getElementById(
            "bracketTournamentSelect"
        );


    if(!select)
        return;


    const tournamentId =
        select.value;


    const bracket =
        document.getElementById(
            "adminBracket"
        );


    const champion =
        document.getElementById(
            "adminChampion"
        );


    if(!tournamentId){

        bracket.innerHTML = `

            <div class="empty">
                Оберіть турнір
            </div>

        `;


        champion.innerHTML =
            "";


        return;
    }


    const {
        data:bracketMatches,
        error
    } =
        await supabaseClient
            .from("matches")
            .select("*")
            .eq(
                "tournament_id",
                tournamentId
            )
            .order(
                "match_number",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(error);


        bracket.innerHTML = `

            <div class="empty">
                Не вдалося завантажити сітку
            </div>

        `;


        return;
    }


    if(
        !bracketMatches ||
        !bracketMatches.length
    ){

        bracket.innerHTML = `

            <div class="empty">
                Сітку ще не сформовано
            </div>

        `;


        champion.innerHTML =
            "";


        return;
    }


    const roundOrder = [

        "1/16 фіналу",

        "1/8 фіналу",

        "1/4 фіналу",

        "1/2 фіналу",

        "Фінал"

    ];


    const existingRounds =
        roundOrder.filter(
            round =>
                bracketMatches.some(
                    m =>
                        m.round ===
                        round
                )
        );


    const finalMatch =
        bracketMatches.find(
            m =>
                m.round ===
                "Фінал"
        );


    if(
        finalMatch &&
        finalMatch.status ===
        "finished" &&
        finalMatch.winner_id
    ){

        const championTeam =
            teams.find(
                t =>
                    Number(t.id) ===
                    Number(
                        finalMatch.winner_id
                    )
            );


        if(championTeam){

            champion.innerHTML = `

                <div class="champion-box">

                    <div class="trophy">
                        🏆
                    </div>


                    <h3>
                        ЧЕМПІОН ТУРНІРУ
                    </h3>


                    <div class="champion-name">

                        ${escapeHtml(
                            championTeam.name
                        )}

                    </div>

                </div>

            `;

        }else{

            champion.innerHTML =
                "";

        }

    }else{

        champion.innerHTML =
            "";

    }


    bracket.innerHTML =
        existingRounds.map(
            round => {

                const roundMatches =
                    bracketMatches
                        .filter(
                            m =>
                                m.round ===
                                round
                        )
                        .sort(
                            (a,b) =>
                                Number(
                                    a.match_number
                                ) -
                                Number(
                                    b.match_number
                                )
                        );


                return `

                    <div class="bracket-round">

                        <div class="bracket-round-title">
                            ${round}
                        </div>


                        <div class="bracket-matches">

                            ${
                                roundMatches
                                    .map(
                                        match =>
                                            renderBracketMatch(
                                                match
                                            )
                                    )
                                    .join("")
                            }

                        </div>

                    </div>

                `;

            }
        ).join("");

}


function renderBracketMatch(
    match
){

    const team1 =
        teams.find(
            t =>
                Number(t.id) ===
                Number(
                    match.team1_id
                )
        );


    const team2 =
        teams.find(
            t =>
                Number(t.id) ===
                Number(
                    match.team2_id
                )
        );


    const team1Winner =
        match.winner_id &&
        Number(
            match.winner_id
        ) ===
        Number(
            match.team1_id
        );


    const team2Winner =
        match.winner_id &&
        Number(
            match.winner_id
        ) ===
        Number(
            match.team2_id
        );


    return `

        <div class="bracket-match">

            <div
                class="
                    bracket-team
                    ${
                        team1Winner
                        ? "bracket-winner"
                        : ""
                    }
                "
            >

                <span class="bracket-team-name">

                    ${escapeHtml(
                        team1?.name ||
                        "TBD"
                    )}

                </span>


                <span class="bracket-score">

                    ${
                        match.team1_score ??
                        0
                    }

                </span>

            </div>


            <div
                class="
                    bracket-team
                    ${
                        team2Winner
                        ? "bracket-winner"
                        : ""
                    }
                "
            >

                <span class="bracket-team-name">

                    ${escapeHtml(
                        team2?.name ||
                        "TBD"
                    )}

                </span>


                <span class="bracket-score">

                    ${
                        match.team2_score ??
                        0
                    }

                </span>

            </div>


            <div class="bracket-meta">

                Матч #${match.match_number}


                ${
                    match.map

                    ?

                    ` · ${escapeHtml(
                        match.map
                    )}`

                    :

                    ""
                }


                ${
                    match.status ===
                    "live"

                    ?

                    `

                        ·

                        <span
                            style="
                                color:#ff7786;
                            "
                        >
                            LIVE
                        </span>

                    `

                    :

                    ""
                }


                ${
                    match.status ===
                    "finished"

                    ?

                    `

                        ·

                        <span
                            style="
                                color:#65e0a5;
                            "
                        >
                            ✓
                        </span>

                    `

                    :

                    ""
                }

            </div>

        </div>

    `;

}

/* =========================================================

function closeModal(id){

    const modal =
        document.getElementById(
            id
        );


    if(modal){

        modal.classList.remove(
            "show"
        );

    }

}


document
    .querySelectorAll(
        ".modal"
    )
    .forEach(
        modal => {

            modal.addEventListener(
                "click",
                function(e){

                    if(
                        e.target ===
                        modal
                    ){

                        modal.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }
    );


function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttr(
    value
){

    return escapeHtml(
        value
    );

}


function formatDate(
    value
){

    if(!value)
        return "—";


    const date =
        new Date(
            value
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleString(
        "uk-UA",
        {
            dateStyle:
                "medium",

            timeStyle:
                "short"
        }
    );

}
