<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Рейтинг — V1ME Community</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .ranking-page {
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
        }

        .title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
        }

        .ranking {
            background: #15151d;
            border: 1px solid #292936;
            border-radius: 15px;
            overflow: hidden;
        }

        .ranking-header,
        .ranking-row {
            display: grid;
            grid-template-columns: 70px 1fr 120px 120px;
            align-items: center;
            padding: 20px;
        }

        .ranking-header {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 1px solid #292936;
        }

        .ranking-row {
            border-bottom: 1px solid #292936;
            transition: 0.2s;
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-row:hover {
            background: #1b1b25;
        }

        .position {
            font-size: 22px;
            font-weight: 900;
            color: #888;
        }

        .team-name {
            font-size: 18px;
            font-weight: 800;
        }

        .tag {
            color: #a855f7;
            font-size: 13px;
        }

        .points {
            font-weight: 800;
            color: #a855f7;
        }

        .wins {
            color: #aaa;
        }

        @media (max-width: 700px) {

            .title {
                font-size: 32px;
            }

            .ranking-header,
            .ranking-row {
                grid-template-columns: 45px 1fr 80px;
                padding: 15px;
            }

            .ranking-header div:nth-child(4),
            .ranking-row div:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
